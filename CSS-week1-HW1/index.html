
  <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 2 Coursera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main" class="skip-link">Chuyển đến Nội dung chính</a>
    
    <header>
        <nav>
            <img src="https://via.placeholder.com/150" alt="Logo">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Giới thiệu</a></li>
            </ul>
        </nav>
    </header>
    
    <main id="main">
        <section>
            <h2>Phần Grid</h2>
            <div class="grid">
                <img src="https://via.placeholder.com/300" alt="Ảnh 1">
                <img src="https://via.placeholder.com/300" alt="Ảnh 2">
                <img src="https://via.placeholder.com/300" alt="Ảnh 3">
                <img src="https://via.placeholder.com/300" alt="Ảnh 4">
            </div>
        </section>

        <section>
            <h2>Phần Flexbox</h2>
            <div class="flex">
                <div class="box">Nội dung 1</div>
                <div class="box">Nội dung 2</div>
                <div class="box">Nội dung 3</div>
            </div>
        </section>
    </main>
</body>
</html>

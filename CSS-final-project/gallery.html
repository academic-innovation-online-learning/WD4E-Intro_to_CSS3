<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery | Michigan Nature Journal</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to Main Content</a>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="gallery.html">Gallery</a>
        <a href="tips.html">Walk Tips</a>
      </nav>
      <h1>Seasonal Gallery</h1>
    </header>

    <main id="main">
      <section class="gallery-grid">
        <img
          src="images/bend_in_the_road.png"
          alt="Purple tree beside a green road"
        />
        <img
          src="images/pink_blossoms.png"
          alt="Small pink blossoms on a leafy tree"
        />
        <img
          src="images/blooming_trees.png"
          alt="Brown dog sitting in front of blooming trees"
        />
        <img
          src="images/hanging_plants.png"
          alt="Red and green plants in a hanging basket"
        />
        <img src="images/tulips.png" alt="Bright red tulips in a garden" />
        <img
          src="images/lake_view.JPG"
          alt="A lake view partly hidden by branches"
        />
        <img
          src="images/huron_river_cascades.JPG"
          alt="Kayakers approaching small river rapids"
        />
        <img src="images/munising.jpg" alt="Small waterfall in a forest" />
        <img
          src="images/reflected_tree.JPG"
          alt="Trees reflected in still water"
        />
      </section>
    </main>

    <footer>
      <p>Images are arranged with CSS Grid and styled with the box model.</p>
    </footer>
  </body>
</html>
